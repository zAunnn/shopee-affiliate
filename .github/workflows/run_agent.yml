name: Shopee Affiliate Agent

on:
  schedule:
    - cron: '0 */6 * * *'  # รันอัตโนมัติทุกๆ 6 ชั่วโมง
  workflow_dispatch:        # เปิดให้กดปุ่มรันด้วยมือ (Manual) ได้ตลอดเวลา

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run Python Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
