name: Shopee Affiliate Agent

on:
  schedule:
    - cron: '0 */6 * * *'  # รันอัตโนมัติทุกๆ 6 ชั่วโมง
  workflow_dispatch:  # เปิดให้กดปุ่มรันด้วยมือ (Manual) ได้ตลอดเวลา

permissions:
  contents: write  # เพิ่มสิทธิ์เพื่อให้ Actions สามารถบันทึกไฟล์กลับเข้า Repo ได้

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Run Python Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python main.py

      - name: Commit updated history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update posted history [skip ci]"
          file_pattern: history.json
